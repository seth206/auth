<!DOCTYPE html>
<html>

</head>
<body>

<form id="signupForm">
  <h2>Signup</h2>
  <input type="text" id="username" placeholder="Username" required>
  
  <!-- Added an id and dynamic pattern matching -->
  <input type="password" id="password" placeholder="Password" required 
         oninput="passwordconf.pattern = this.value">

        <h2>login</h2>

        <input type="password" id="password" placeholder="password" required>
        
        <button>login</button>

</html>
